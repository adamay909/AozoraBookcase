{{/* category */}}

SITEBANNER

<h2>『{{.Category}}』に分類される本</h2>
<div class="titlelist">
  {{ range .Books }} {{ $x := . }}
  <a href="#books/book_{{$x.AuthorID}}_{{$x.BookID}}.html" class="titlelist">
    <div class="booklink">
      <span class="yomi">{{$x.TitleY}} {{$x.SubtitleY}}</span><br />
      <span class="title">{{$x.Title}} {{$x.Subtitle}}</span><br />
      <span class="note">作者:{{$x.FullName}}</span><br />
    </div>
  </a>
  {{end}}
</div>
