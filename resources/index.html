{{/* index */}}

<div id="mainarea">
  SITEBANNER

  <h2>作者一覧</h2>
  <div class="navigation">
    {{ range .SectionData}}
    <div class="navbutton">
      <a href="#index.html::{{.Char}}" class="navigation"
        ><div class="navbutton">{{.Char}}</div></a
      >
    </div>
    {{ end }}
  </div>

  <div class="authorlist">
    {{ range .SectionData }}
    <div id="index.html::{{.Char}}"></div>
    <h2 class="al-header">{{.Char}}</h2>
    <div class="authorlistsection">
      {{ range .List }} {{ $x := . }}
      <a href="#authors/author_{{.AuthorID}}.html">
        <div class="authorlistbutton">
          {{ range .NameParts }}
          <ruby>{{ . }}<rt>{{ $x.FullNameY }}</rt></ruby
          >{{ end }}
        </div>
      </a>
      {{end}}
    </div>
    {{ end}}
  </div>
</div>
